files_in = '/scratch/marian/ic-course/data/IN_FILE.detsim.h5'
file_out = '/scratch/marian/IC/outputs/OUT_FILE.hypathia.h5'

# compression library
compression = 'ZLIB4'

# run number
run_number = 0
# detector_db = 'next100fibers'
detector_db = 'next100'

# How frequently to print events
print_mod = 1

EP_wfs_rebin    = 1 # [ns]
EP_pe_rms       = 0.4 * pes
sipm_noise_cut  = 1.0 * pes
filter_padding  = 50

# max number of events to run
# event_range =  0, 2
event_range =  all

# Set thresholds for calibrated sum
# thr_csum_s1 = 0.5 * pes
# thr_csum_s2 = 2.0 * pes
thr_csum_s1 = 0.1 * pes
thr_csum_s2 = 0.1 * pes

# Set thresholds for SiPM
thr_sipm      = 1.0 * pes
thr_sipm_type = common


# Set parameters to search for S1
# Notice that in MC file S1 is in t=100 mus
s1_tmin       =  99 * mus # position of S1 in MC files at 100 mus
s1_tmax       = 101 * mus # change tmin and tmax if S1 not at 100 mus
s1_stride     =   1       # minimum number of 25 ns bins in S1 searches
s1_lmin       =   1       # 8 x 25 = 200 ns
s1_lmax       =  40       # 20 x 25 = 500 ns
s1_rebin_stride = 1       # Do not rebin S1 by default

# Set parameters to search for S2
s2_tmin     =    101 * mus # assumes S1 at 100 mus, change if S1 not at 100 mus
s2_tmax     =   1499 * mus # end of the window
s2_stride   =     10       # 10 x 100ns = 1   mus
s2_lmin     =     20       # 20 x 100ns = 2 mus
s2_lmax     = 100000       # maximum value of S2 width
s2_rebin_stride = 10       # Rebin by default, 40 25 ns time bins to make one 1us time bin

# Set S2Si parameters
thr_sipm_s2 = 5 * pes  # Threshold for the full sipm waveform

EP_samp_wid  = 100 * ns
sipm_samp_wid = 1 * mus
